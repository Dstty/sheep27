<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未羊秘境 · 星罗六合阵</title>
    <style>
        /* ========== 全局重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #0c0c1a 0%, #05050e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 20px;
        }

        .container {
            width: 1100px;
            max-width: 98vw;
            background: rgba(18, 18, 40, 0.55);
            backdrop-filter: blur(2px);
            border-radius: 48px;
            padding: 30px 40px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 0 80px rgba(100, 80, 140, 0.08);
            border: 1px solid rgba(180, 160, 200, 0.08);
        }

        /* ========== 剧情 ========== */
        .story-area {
            padding: 18px 20px 22px;
            margin-bottom: 28px;
            border-bottom: 1px solid rgba(200, 180, 160, 0.10);
            position: relative;
        }
        .story-area::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 10%;
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(210, 190, 160, 0.25), transparent);
        }
        .story-text {
            color: #d4c8b0;
            font-size: 17px;
            line-height: 1.8;
            text-align: left;              /* 左对齐 */
            letter-spacing: 0.6px;
            text-shadow: 0 0 20px rgba(160, 130, 80, 0.15), 0 2px 8px rgba(0, 0, 0, 0.6);
            font-weight: 300;
            max-width: 920px;
            margin: 0 auto;
        }
        .story-text .highlight {
            color: #ecd8b0;
            font-weight: 400;
            text-shadow: 0 0 30px rgba(220, 180, 100, 0.25);
        }
        .story-text .voice {
            display: inline-block;
            color: #c8b89a;
            /* font-style: italic;  移除斜体 */
            letter-spacing: 1px;
            padding: 0 6px;
        }
        .story-text .indent {
            display: block;
            margin-top: 8px;
            font-size: 0.95em;
        }

        /* ========== 画布（稍微缩小，aspect-ratio 改为 16/9） ========== */
        .canvas-area {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;          /* 原16/10，更扁一点 */
            min-height: 340px;             /* 适当降低最小高度 */
            background: radial-gradient(ellipse at 50% 50%, #13132a 0%, #0a0a18 100%);
            border-radius: 32px;
            border: 1px solid rgba(140, 120, 180, 0.10);
            box-shadow: inset 0 0 100px rgba(20, 10, 40, 0.7), 0 8px 32px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        /* 背景星点装饰 */
        .canvas-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 12% 18%, rgba(200, 190, 220, 0.15), transparent),
                radial-gradient(1px 1px at 28% 65%, rgba(200, 190, 220, 0.10), transparent),
                radial-gradient(1.5px 1.5px at 45% 30%, rgba(200, 190, 220, 0.12), transparent),
                radial-gradient(1px 1px at 62% 80%, rgba(200, 190, 220, 0.08), transparent),
                radial-gradient(1px 1px at 78% 42%, rgba(200, 190, 220, 0.14), transparent),
                radial-gradient(1.5px 1.5px at 90% 15%, rgba(200, 190, 220, 0.10), transparent),
                radial-gradient(1px 1px at 8% 90%, rgba(200, 190, 220, 0.06), transparent),
                radial-gradient(1px 1px at 55% 10%, rgba(200, 190, 220, 0.09), transparent),
                radial-gradient(1px 1px at 85% 70%, rgba(200, 190, 220, 0.07), transparent),
                radial-gradient(1px 1px at 35% 95%, rgba(200, 190, 220, 0.05), transparent);
            pointer-events: none;
            z-index: 0;
        }

        /* ========== 线条画布 ========== */
        #lineCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* ========== 阵点 ========== */
        .point {
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: default;
            z-index: 3;
            transform: translate(-50%, -50%);
            transition: background 0.35s ease, transform 0.35s ease;
            will-change: transform, left, top;
            background: #3a3a4a;
            border: none;
            box-shadow: none;
        }

        .point::after {
            content: '◆';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8px;
            color: rgba(160, 150, 180, 0.30);
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
            pointer-events: none;
        }

        .point.unlocked {
            background: #e8b82a;
            cursor: grab;
        }

        .point.unlocked::after {
            content: '✦';
            color: rgba(255, 240, 180, 0.85);
            font-size: 16px;
            text-shadow: 0 0 16px rgba(255, 200, 80, 0.6);
        }

        .point.dragging {
            cursor: grabbing;
            transform: translate(-50%, -50%) scale(1.15);
            transition: transform 0.15s ease;
            background: #f5c842;
        }

        .point.just-unlocked {
            animation: unlockPulse 0.6s ease;
        }

        @keyframes unlockPulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            30% { transform: translate(-50%, -50%) scale(1.5); }
            60% { transform: translate(-50%, -50%) scale(0.9); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .point:not(.unlocked):hover {
            background: #50506a;
        }

        /* ========== 底部区域 ========== */
        .bottom-area {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .completion-area {
            color: rgba(220, 200, 160, 0.50);
            font-size: 15px;
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 80, 0.08);
            backdrop-filter: blur(4px);
        }
        .completion-area .num {
            color: #f5d77a;
            font-weight: 600;
            text-shadow: 0 0 20px rgba(255, 200, 60, 0.15);
        }

        .congrats {
            color: #f5d77a;
            font-size: 18px;
            font-family: 'Georgia', serif;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(255, 200, 60, 0.3);
            background: rgba(0, 0, 0, 0.35);
            padding: 8px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 80, 0.25);
            backdrop-filter: blur(4px);
            display: none;
            transition: opacity 0.5s ease;
        }
        .congrats.show {
            display: block;
            animation: glowPulse 2s infinite alternate;
        }

        @keyframes glowPulse {
            0% { text-shadow: 0 0 20px rgba(255, 200, 60, 0.2); }
            100% { text-shadow: 0 0 40px rgba(255, 200, 60, 0.6); }
        }

        /* ========== 重置按钮 ========== */
        .reset-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 4px;
        }
        .reset-btn {
            background: rgba(255, 215, 80, 0.08);
            border: 1px solid rgba(255, 215, 80, 0.15);
            color: rgba(220, 200, 160, 0.7);
            padding: 6px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            letter-spacing: 1px;
        }
        .reset-btn:hover {
            background: rgba(255, 215, 80, 0.15);
            border-color: rgba(255, 215, 80, 0.3);
            color: #f5d77a;
            box-shadow: 0 0 20px rgba(255, 200, 60, 0.05);
        }
        .reset-btn:active {
            transform: scale(0.96);
        }

        /* ========== 关卡列表（宽度100%） ========== */
        .level-list {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            gap: 4px;
        }

        .level-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 18px;
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            color: rgba(200, 190, 180, 0.8);
            transition: background 0.2s;
        }
        .level-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .level-item .status {
            width: 28px;
            text-align: center;
            font-size: 22px;
            transition: all 0.3s;
        }
        .level-item .status.done {
            color: #f5d77a;
            text-shadow: 0 0 12px rgba(255, 200, 60, 0.3);
        }
        .level-item .name {
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 800px) {
            .container {
                padding: 20px 16px 24px;
                border-radius: 28px;
            }
            .story-text {
                font-size: 15px;
                line-height: 1.7;
            }
            .point {
                width: 20px;
                height: 20px;
            }
            .point::after {
                font-size: 7px;
            }
            .point.unlocked::after {
                font-size: 14px;
            }
            .completion-area {
                font-size: 13px;
                padding: 4px 14px;
            }
            .congrats {
                font-size: 16px;
                padding: 6px 20px;
            }
            .level-list {
                padding: 8px 14px;
            }
            .level-item {
                font-size: 16px;
                gap: 10px;
                padding: 4px 8px;
            }
            .level-item .status {
                font-size: 18px;
                width: 24px;
            }
            .canvas-area {
                min-height: 280px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 14px 10px 18px;
                border-radius: 20px;
            }
            .story-text {
                font-size: 13px;
                line-height: 1.6;
            }
            .point {
                width: 18px;
                height: 18px;
            }
            .point::after {
                font-size: 6px;
            }
            .point.unlocked::after {
                font-size: 12px;
            }
            .canvas-area {
                aspect-ratio: 4 / 3;
                min-height: 220px;
                border-radius: 20px;
            }
            .completion-area {
                font-size: 11px;
                padding: 3px 10px;
            }
            .congrats {
                font-size: 14px;
                padding: 4px 14px;
            }
            .level-list {
                padding: 6px 10px;
                gap: 2px;
            }
            .level-item {
                font-size: 14px;
                gap: 8px;
                padding: 3px 6px;
            }
            .level-item .status {
                font-size: 16px;
                width: 20px;
            }
            .reset-btn {
                font-size: 12px;
                padding: 4px 16px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 剧情 -->
    <div class="story-area">
        <div class="story-text">
            <span class="highlight">白光一闪</span>，你的感知仿佛坠入了一片无垠的灰色虚空。<br>
            虚空中，一个古老、干涩，却又带着一种祥和慈悲的声音响起：<br>
            <span class="voice">“寻宝者，能在丁未羊年新年之际踏入这未羊秘境，也算与吾有缘。”</span><br>
            <span class="voice">“但天下没有白得的好处。若想取走这阵眼深处的秘藏，你还需亲手补全这<span class="highlight">星罗六合阵</span>。”</span><br>
            <span class="voice indent">“这些基石皆带有试炼烙印。未解其关者，皆为死铁，沉重难移；破其试炼者，方可任你驱使挪动。去点亮它们吧，让沉睡的星辰重新苏醒。”</span>
        </div>
    </div>

    <!-- 画布（缩小） -->
    <div class="canvas-area" id="canvasArea">
        <canvas id="lineCanvas"></canvas>
        <!-- 阵点由 JavaScript 动态生成 -->
    </div>

    <!-- 底部 -->
    <div class="bottom-area">
        <div class="completion-area">
            ⚡ 六合阵法完成程度：<span class="num" id="completionCount">0</span> / 6
        </div>

        <!-- 重置按钮 -->
        <div class="reset-wrapper">
            <button class="reset-btn" id="resetBtn">⟳ 重置位置</button>
        </div>

        <!-- 关卡列表 -->
        <div class="level-list" id="levelList"></div>

        <!-- 祝贺信息 -->
        <div class="congrats" id="congratsMessage">✨ 恭喜你，已经完成了阵法。 ✨</div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // -------- 配置 --------
        const POINT_COUNT = 11;
        const POINT_SIZE = 22;
        const COLLINEAR_THRESHOLD = 3;

        // ================================================================
        //  ★★★ 自定义关卡名字 ★★★
        // ================================================================
        const LEVEL_NAMES = [
            'Only Out to Daoyou',
            '拼图',
            '调查问卷',
            '飞羊令',
            '格线之中',
            '我和dpsk聊了一整晚',
            '混乱文章',
            '共通密码',
            '连珠',
            '炼药房',
            '红黄蓝绿'
        ];

        // -------- DOM 引用 --------
        const canvas = document.getElementById('canvasArea');
        const lineCanvas = document.getElementById('lineCanvas');
        const ctx = lineCanvas.getContext('2d');
        const completionSpan = document.getElementById('completionCount');
        const congratsEl = document.getElementById('congratsMessage');
        const levelListEl = document.getElementById('levelList');
        const resetBtn = document.getElementById('resetBtn');

        // -------- 状态 --------
        const points = [];
        let initialPositions = [];
        let dragState = null;

        // -------- 生成均匀分布在圆上的位置（无随机偏移） --------
        function generatePositions(count, containerWidth, containerHeight) {
            const positions = [];
            const cx = containerWidth / 2;
            const cy = containerHeight / 2;
            const radius = Math.min(containerWidth, containerHeight) * 0.36; // 稍微增大半径使分布更舒展

            for (let i = 0; i < count; i++) {
                const angle = (i / count) * 2 * Math.PI - Math.PI / 2; // 从正上方开始
                let x = cx + radius * Math.cos(angle);
                let y = cy + radius * Math.sin(angle);

                // 边界保护
                const half = POINT_SIZE / 2;
                x = Math.max(half, Math.min(containerWidth - half, x));
                y = Math.max(half, Math.min(containerHeight - half, y));

                positions.push({ x, y });
            }
            return positions;
        }

        // -------- 确保画布尺寸 --------
        function ensureCanvasSize() {
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            if (lineCanvas.width !== w || lineCanvas.height !== h) {
                lineCanvas.width = w;
                lineCanvas.height = h;
            }
        }

        // -------- 共线检测 (合并重复直线) --------
        function detectCollinearLines(pts) {
            const n = pts.length;
            const candidates = [];

            for (let i = 0; i < n; i++) {
                for (let j = i + 1; j < n; j++) {
                    const p1 = pts[i];
                    const p2 = pts[j];
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    if (Math.abs(dx) < 1e-6 && Math.abs(dy) < 1e-6) continue;

                    const A = dy;
                    const B = -dx;
                    const C = -(A * p1.x + B * p1.y);
                    const norm = Math.sqrt(A * A + B * B);
                    if (norm < 1e-6) continue;
                    const a = A / norm;
                    const b = B / norm;
                    const c = C / norm;

                    const indices = [];
                    for (let m = 0; m < n; m++) {
                        const p = pts[m];
                        const dist = Math.abs(a * p.x + b * p.y + c);
                        if (dist < COLLINEAR_THRESHOLD) {
                            indices.push(m);
                        }
                    }
                    if (indices.length >= 4) {
                        candidates.push(new Set(indices));
                    }
                }
            }

            // 合并候选集
            let merged = [];
            for (let set of candidates) {
                let mergedWith = false;
                for (let i = 0; i < merged.length; i++) {
                    const existing = merged[i];
                    let intersectCount = 0;
                    for (let idx of set) {
                        if (existing.has(idx)) intersectCount++;
                    }
                    if (intersectCount >= 2) {
                        for (let idx of set) {
                            existing.add(idx);
                        }
                        mergedWith = true;
                        break;
                    }
                }
                if (!mergedWith) {
                    merged.push(new Set(set));
                }
            }

            // 反复合并
            let changed = true;
            while (changed) {
                changed = false;
                for (let i = 0; i < merged.length; i++) {
                    for (let j = i + 1; j < merged.length; j++) {
                        const setA = merged[i];
                        const setB = merged[j];
                        let intersectCount = 0;
                        for (let idx of setA) {
                            if (setB.has(idx)) intersectCount++;
                        }
                        if (intersectCount >= 2) {
                            for (let idx of setB) {
                                setA.add(idx);
                            }
                            merged.splice(j, 1);
                            changed = true;
                            break;
                        }
                    }
                    if (changed) break;
                }
            }

            return merged;
        }

        // -------- 绘制金色线条 --------
        function drawLines(lines, pts) {
            ensureCanvasSize();
            ctx.clearRect(0, 0, lineCanvas.width, lineCanvas.height);
            if (lines.length === 0) return;

            ctx.save();
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = '#FFD700';
            ctx.shadowBlur = 12;
            ctx.globalAlpha = 0.85;

            for (let set of lines) {
                const arr = Array.from(set);
                if (arr.length < 2) continue;
                const pointList = arr.map(idx => pts[idx]);
                let maxDist = -1;
                let p1 = pointList[0], p2 = pointList[0];
                for (let i = 0; i < pointList.length; i++) {
                    for (let j = i + 1; j < pointList.length; j++) {
                        const d = Math.hypot(pointList[i].x - pointList[j].x, pointList[i].y - pointList[j].y);
                        if (d > maxDist) {
                            maxDist = d;
                            p1 = pointList[i];
                            p2 = pointList[j];
                        }
                    }
                }
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const len = Math.hypot(dx, dy);
                if (len < 1) continue;
                const ex = dx / len;
                const ey = dy / len;
                const extend = 25;
                const x1 = p1.x - ex * extend;
                const y1 = p1.y - ey * extend;
                const x2 = p2.x + ex * extend;
                const y2 = p2.y + ey * extend;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
            ctx.restore();
        }

        // -------- 更新共线检测、完成度及祝贺 --------
        function updateLines() {
            const pts = points.map(p => ({ x: p.x, y: p.y, id: p.id }));
            const lines = detectCollinearLines(pts);
            drawLines(lines, pts);
            const count = lines.length;
            completionSpan.textContent = count;

            if (count >= 6) {
                congratsEl.classList.add('show');
            } else {
                congratsEl.classList.remove('show');
            }
        }

        // -------- 更新关卡列表 --------
        function updateLevelList() {
            levelListEl.innerHTML = '';
            for (let i = 0; i < points.length; i++) {
                const p = points[i];
                const item = document.createElement('div');
                item.className = 'level-item';

                const statusSpan = document.createElement('span');
                statusSpan.className = 'status';
                if (p.unlocked) {
                    statusSpan.textContent = '✅';
                    statusSpan.classList.add('done');
                } else {
                    statusSpan.textContent = '☐';
                }

                const nameSpan = document.createElement('span');
                nameSpan.className = 'name';
                nameSpan.textContent = LEVEL_NAMES[i] || `第${i+1}关`;

                item.appendChild(statusSpan);
                item.appendChild(nameSpan);
                levelListEl.appendChild(item);
            }
        }

        // -------- 重置位置 --------
        function resetPositions() {
            if (!initialPositions.length) return;
            for (let i = 0; i < points.length; i++) {
                const p = points[i];
                p.x = initialPositions[i].x;
                p.y = initialPositions[i].y;
                p.el.style.left = p.x + 'px';
                p.el.style.top = p.y + 'px';
                p.el.classList.remove('dragging', 'just-unlocked');
            }
            updateLines();
            updateLevelList();
            congratsEl.classList.remove('show');
        }

        // -------- 创建阵点 --------
        function createPoints() {
            const cw = canvas.clientWidth;
            const ch = canvas.clientHeight;
            const posList = generatePositions(POINT_COUNT, cw, ch);
            initialPositions = posList.slice();

            canvas.querySelectorAll('.point').forEach(el => el.remove());

            for (let i = 0; i < POINT_COUNT; i++) {
                const pos = posList[i];
                const el = document.createElement('div');
                el.className = 'point';
                el.dataset.index = i;
                el.style.left = pos.x + 'px';
                el.style.top = pos.y + 'px';
                el.title = LEVEL_NAMES[i] || `第${i+1}关`;

                const pointData = {
                    el: el,
                    x: pos.x,
                    y: pos.y,
                    unlocked: false,
                    id: i,
                };
                points.push(pointData);

                el.addEventListener('click', handleClick);
                el.addEventListener('dblclick', handleDblClick);
                el.addEventListener('mousedown', handleMouseDown);

                canvas.appendChild(el);
            }

            updateLevelList();
            updateLines();
        }

        // -------- 事件处理 --------
        function handleClick(e) {
            e.stopPropagation();
        }

        function handleDblClick(e) {
            e.stopPropagation();
            const el = e.currentTarget;
            const index = parseInt(el.dataset.index, 10);
            const point = points[index];
            if (!point || point.unlocked) return;

            point.unlocked = true;
            el.classList.add('unlocked', 'just-unlocked');
            setTimeout(() => el.classList.remove('just-unlocked'), 700);

            updateLevelList();
            updateLines();
        }

        // -------- 拖拽 --------
        function handleMouseDown(e) {
            const el = e.currentTarget;
            const index = parseInt(el.dataset.index, 10);
            const point = points[index];
            if (!point || !point.unlocked) return;

            e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.clientWidth / rect.width;
            const scaleY = canvas.clientHeight / rect.height;

            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;

            dragState = {
                pointIndex: index,
                offsetX: point.x - mouseX,
                offsetY: point.y - mouseY,
            };

            el.classList.add('dragging');

            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
        }

        function handleMouseMove(e) {
            if (!dragState) return;
            e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.clientWidth / rect.width;
            const scaleY = canvas.clientHeight / rect.height;

            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;

            const idx = dragState.pointIndex;
            const point = points[idx];
            if (!point) return;

            let newX = mouseX + dragState.offsetX;
            let newY = mouseY + dragState.offsetY;

            const half = POINT_SIZE / 2;
            const maxX = canvas.clientWidth - half;
            const maxY = canvas.clientHeight - half;
            newX = Math.max(half, Math.min(maxX, newX));
            newY = Math.max(half, Math.min(maxY, newY));

            point.x = newX;
            point.y = newY;
            point.el.style.left = newX + 'px';
            point.el.style.top = newY + 'px';

            updateLines();
        }

        function handleMouseUp(e) {
            if (!dragState) return;
            const idx = dragState.pointIndex;
            const point = points[idx];
            if (point) {
                point.el.classList.remove('dragging');
            }
            dragState = null;
            document.removeEventListener('mousemove', handleMouseMove);
            document.removeEventListener('mouseup', handleMouseUp);
            updateLines();
        }

        // -------- 窗口尺寸变化 --------
        let resizeTimer = null;

        function handleResize() {
            if (resizeTimer) {
                cancelAnimationFrame(resizeTimer);
                resizeTimer = null;
            }
            resizeTimer = requestAnimationFrame(() => {
                const unlockedStates = points.map(p => p.unlocked);
                points.length = 0;
                canvas.querySelectorAll('.point').forEach(el => el.remove());

                const cw = canvas.clientWidth;
                const ch = canvas.clientHeight;
                const posList = generatePositions(POINT_COUNT, cw, ch);
                initialPositions = posList.slice();

                for (let i = 0; i < POINT_COUNT; i++) {
                    const pos = posList[i];
                    const el = document.createElement('div');
                    el.className = 'point';
                    el.dataset.index = i;
                    el.style.left = pos.x + 'px';
                    el.style.top = pos.y + 'px';
                    el.title = LEVEL_NAMES[i] || `第${i+1}关`;

                    const pointData = {
                        el: el,
                        x: pos.x,
                        y: pos.y,
                        unlocked: unlockedStates[i] || false,
                        id: i,
                    };
                    points.push(pointData);

                    if (pointData.unlocked) {
                        el.classList.add('unlocked');
                    }

                    el.addEventListener('click', handleClick);
                    el.addEventListener('dblclick', handleDblClick);
                    el.addEventListener('mousedown', handleMouseDown);

                    canvas.appendChild(el);
                }

                ensureCanvasSize();
                updateLevelList();
                updateLines();
                resizeTimer = null;
            });
        }

        // -------- 初始化 --------
        function init() {
            ensureCanvasSize();
            createPoints();

            let ro = null;
            if (window.ResizeObserver) {
                ro = new ResizeObserver(() => handleResize());
                ro.observe(canvas);
            } else {
                window.addEventListener('resize', handleResize);
            }

            requestAnimationFrame(() => {
                ensureCanvasSize();
                updateLines();
            });

            resetBtn.addEventListener('click', resetPositions);
        }

        if (document.readyState === 'complete') {
            init();
        } else {
            window.addEventListener('load', init);
        }

        window.__points = points;
        window.__updateLines = updateLines;

    })();
</script>
</body>
</html>
