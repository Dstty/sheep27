<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>未羊秘境 · 星罗六合阵</title>

    <!-- ===== 全局配置（必须放在最前面） ===== -->
    <script src="config.js"></script>
    <!-- ===== 公共页面逻辑（负责渲染关卡列表、侧边栏等） ===== -->
    <script src="puzzlelist.js"></script>

    <style>
        /* ========== 全局重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #0c0c1a 0%, #05050e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 20px;
        }

        .container {
            width: 1100px;
            max-width: 98vw;
            background: rgba(18, 18, 40, 0.55);
            backdrop-filter: blur(2px);
            border-radius: 48px;
            padding: 30px 40px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 0 80px rgba(100, 80, 140, 0.08);
            border: 1px solid rgba(180, 160, 200, 0.08);
        }

        /* ========== 剧情 ========== */
        .story-area {
            padding: 18px 20px 22px;
            margin-bottom: 28px;
            border-bottom: 1px solid rgba(200, 180, 160, 0.10);
            position: relative;
        }
        .story-area::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 10%;
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(210, 190, 160, 0.25), transparent);
        }
        .story-text {
            color: #d4c8b0;
            font-size: 17px;
            line-height: 1.8;
            text-align: left;
            letter-spacing: 0.6px;
            text-shadow: 0 0 20px rgba(160, 130, 80, 0.15), 0 2px 8px rgba(0, 0, 0, 0.6);
            font-weight: 300;
            max-width: 920px;
            margin: 0 auto;
        }
        .story-text .highlight {
            color: #ecd8b0;
            font-weight: 400;
            text-shadow: 0 0 30px rgba(220, 180, 100, 0.25);
        }
        .story-text .voice {
            display: inline-block;
            color: #c8b89a;
            letter-spacing: 1px;
            padding: 0 6px;
        }
        .story-text .indent {
            display: block;
            margin-top: 8px;
            font-size: 0.95em;
        }

        /* ========== 画布 ========== */
        .canvas-area {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            min-height: 340px;
            background: radial-gradient(ellipse at 50% 50%, #13132a 0%, #0a0a18 100%);
            border-radius: 32px;
            border: 1px solid rgba(140, 120, 180, 0.10);
            box-shadow: inset 0 0 100px rgba(20, 10, 40, 0.7), 0 8px 32px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        /* 背景星点装饰 */
        .canvas-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 12% 18%, rgba(200, 190, 220, 0.15), transparent),
                radial-gradient(1px 1px at 28% 65%, rgba(200, 190, 220, 0.10), transparent),
                radial-gradient(1.5px 1.5px at 45% 30%, rgba(200, 190, 220, 0.12), transparent),
                radial-gradient(1px 1px at 62% 80%, rgba(200, 190, 220, 0.08), transparent),
                radial-gradient(1px 1px at 78% 42%, rgba(200, 190, 220, 0.14), transparent),
                radial-gradient(1.5px 1.5px at 90% 15%, rgba(200, 190, 220, 0.10), transparent),
                radial-gradient(1px 1px at 8% 90%, rgba(200, 190, 220, 0.06), transparent),
                radial-gradient(1px 1px at 55% 10%, rgba(200, 190, 220, 0.09), transparent),
                radial-gradient(1px 1px at 85% 70%, rgba(200, 190, 220, 0.07), transparent),
                radial-gradient(1px 1px at 35% 95%, rgba(200, 190, 220, 0.05), transparent);
            pointer-events: none;
            z-index: 0;
        }

        /* ========== 线条画布 ========== */
        #lineCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* ========== 阵点 ========== */
        .point {
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: default;
            z-index: 3;
            transform: translate(-50%, -50%);
            transition: background 0.35s ease, transform 0.35s ease;
            will-change: transform, left, top;
            background: #3a3a4a;
            border: none;
            box-shadow: none;
        }

        .point::after {
            content: '◆';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8px;
            color: rgba(160, 150, 180, 0.30);
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
            pointer-events: none;
        }

        .point.unlocked {
            background: #e8b82a;
            cursor: grab;
        }

        .point.unlocked::after {
            content: '✦';
            color: rgba(255, 240, 180, 0.85);
            font-size: 16px;
            text-shadow: 0 0 16px rgba(255, 200, 80, 0.6);
        }

        .point.dragging {
            cursor: grabbing;
            transform: translate(-50%, -50%) scale(1.15);
            transition: transform 0.15s ease;
            background: #f5c842;
        }

        .point.just-unlocked {
            animation: unlockPulse 0.6s ease;
        }

        @keyframes unlockPulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            30% { transform: translate(-50%, -50%) scale(1.5); }
            60% { transform: translate(-50%, -50%) scale(0.9); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .point:not(.unlocked):hover {
            background: #50506a;
        }
        .point {
            cursor: pointer;
        }
        .point.unlocked {
            cursor: grab;
        }
        .point.unlocked.dragging {
            cursor: grabbing;
        }

        /* ========== 底部区域 ========== */
        .bottom-area {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .completion-area {
            color: rgba(220, 200, 160, 0.50);
            font-size: 15px;
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 80, 0.08);
            backdrop-filter: blur(4px);
        }
        .completion-area .num {
            color: #f5d77a;
            font-weight: 600;
            text-shadow: 0 0 20px rgba(255, 200, 60, 0.15);
        }

        /* ========== 重置按钮 ========== */
        .reset-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 4px;
        }
        .reset-btn {
            background: rgba(255, 215, 80, 0.08);
            border: 1px solid rgba(255, 215, 80, 0.15);
            color: rgba(220, 200, 160, 0.7);
            padding: 6px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            letter-spacing: 1px;
        }
        .reset-btn:hover {
            background: rgba(255, 215, 80, 0.15);
            border-color: rgba(255, 215, 80, 0.3);
            color: #f5d77a;
            box-shadow: 0 0 20px rgba(255, 200, 60, 0.05);
        }
        .reset-btn:active {
            transform: scale(0.96);
        }

        /* 调试重置按钮特殊样式 */
        .debug-reset-btn {
            border-color: rgba(200, 80, 80, 0.3) !important;
            color: rgba(200, 120, 120, 0.6) !important;
        }
        .debug-reset-btn:hover {
            border-color: rgba(200, 80, 80, 0.6) !important;
            color: #e09090 !important;
            background: rgba(200, 80, 80, 0.12) !important;
        }

        /* ========== 关卡列表 ========== */
        .level-list {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            gap: 4px;
        }

        .level-items {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-items {
            display: none;
            flex-direction: column;
            gap: 4px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 215, 80, 0.10);
        }
        .meta-items.visible {
            display: flex;
        }

        .level-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 18px;
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            color: rgba(200, 190, 180, 0.8);
            transition: background 0.2s, color 0.2s;
            cursor: pointer;
        }
        .level-item:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #f0e4d0;
        }
        .level-item:active {
            transform: scale(0.98);
        }

        .level-item .status {
            width: 28px;
            text-align: center;
            font-size: 22px;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .level-item .status.done {
            color: #f5d77a;
            text-shadow: 0 0 12px rgba(255, 200, 60, 0.3);
        }

        .level-item.meta-item .status {
            font-size: 22px;
        }

        .level-item .name {
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .level-item .hint-arrow {
            margin-left: auto;
            font-size: 14px;
            color: rgba(200, 190, 180, 0.25);
            transition: color 0.3s;
        }
        .level-item:hover .hint-arrow {
            color: rgba(200, 190, 180, 0.6);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 800px) {
            .container {
                padding: 20px 16px 24px;
                border-radius: 28px;
            }
            .story-text {
                font-size: 15px;
                line-height: 1.7;
            }
            .point {
                width: 20px;
                height: 20px;
            }
            .point::after {
                font-size: 7px;
            }
            .point.unlocked::after {
                font-size: 14px;
            }
            .completion-area {
                font-size: 13px;
                padding: 4px 14px;
            }
            .level-list {
                padding: 8px 14px;
            }
            .level-item {
                font-size: 16px;
                gap: 10px;
                padding: 4px 8px;
            }
            .level-item .status {
                font-size: 18px;
                width: 24px;
            }
            .canvas-area {
                min-height: 280px;
            }
            .meta-items {
                margin-top: 8px;
                padding-top: 8px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 14px 10px 18px;
                border-radius: 20px;
            }
            .story-text {
                font-size: 13px;
                line-height: 1.6;
            }
            .point {
                width: 18px;
                height: 18px;
            }
            .point::after {
                font-size: 6px;
            }
            .point.unlocked::after {
                font-size: 12px;
            }
            .canvas-area {
                aspect-ratio: 4 / 3;
                min-height: 220px;
                border-radius: 20px;
            }
            .completion-area {
                font-size: 11px;
                padding: 3px 10px;
            }
            .level-list {
                padding: 6px 10px;
                gap: 2px;
            }
            .level-item {
                font-size: 14px;
                gap: 8px;
                padding: 3px 6px;
            }
            .level-item .status {
                font-size: 16px;
                width: 20px;
            }
            .reset-btn {
                font-size: 12px;
                padding: 4px 16px;
            }
            .meta-items {
                margin-top: 6px;
                padding-top: 6px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 剧情 -->
        <div class="story-area">
            <div class="story-text">
                <span class="highlight">白光一闪</span>，你的感知仿佛坠入了一片无垠的灰色虚空。<br />
                虚空中，一个古老、干涩，却又带着一种祥和慈悲的声音响起：<br />
                <span class="voice">“寻宝者，能在丁未羊年新年之际踏入这未羊秘境，也算与吾有缘。”</span><br />
                <span class="voice">“但天下没有白得的好处。若想取走这阵眼深处的秘藏，你还需亲手补全这<span class="highlight">星罗六合阵</span>。”</span><br />
                <span class="voice indent">“这些基石皆带有试炼烙印。未解其关者，皆为死铁，沉重难移；破其试炼者，方可任你驱使挪动。去点亮它们吧，让沉睡的星辰重新苏醒。”</span>
            </div>
        </div>

        <!-- 画布 -->
        <div class="canvas-area" id="canvasArea">
            <canvas id="lineCanvas"></canvas>
        </div>

        <!-- 底部 -->
        <div class="bottom-area">
            <div class="completion-area">
                ⚡ 六合阵法完成程度：<span class="num" id="completionCount">0</span> / 6
            </div>

            <div class="reset-wrapper">
                <button class="reset-btn" id="resetBtn">⟳ 重置位置</button>
            </div>

            <!-- 关卡列表由 puzzlelist.js 动态渲染 -->
            <div class="level-list" id="levelList"></div>

            <!-- 调试按钮：重置所有进度 -->
            <div class="reset-wrapper">
                <button class="reset-btn debug-reset-btn" id="debugResetBtn">⚠ 重置所有进度（调试）</button>
            </div>
        </div>
    </div>

    <!-- ===== 核心交互脚本（阵法拖拽逻辑） ===== -->
    <script src="game.js"></script>

</body>
</html>
